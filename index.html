<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Dial-Up Den</title><meta name="description" content="A cozy Y2K apartment you can walk around: music, minigames, a TV for your videos and YouTube links, and real-life habit activities."><style>:root{color-scheme:light}body{margin:0;font:14px system-ui;background:#fbfbfb}img{max-width:100%}[hidden]{display:none!important}</style></head><body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Audiowide&family=Chakra+Petch:wght@400;500;600;700&family=Pixelify+Sans:wght@400;600;700&family=VT323&family=Press+Start+2P&display=swap">
<style>
/* Layout: full-bleed WebGL apartment; candy-plastic sticker HUD floats on top; the PC opens a CRT overlay with its own beveled desktop OS. Single committed look. */
:root{
  --ink:#1d1433;
  --ink-soft:#3b2d63;
  --paper:#fbf7ff;
  --paper-2:#efe8ff;
  --aqua:#22d1e6;
  --bubble:#ff4fae;
  --tang:#ff9f2e;
  --lime:#b8f03a;
  --lilac:#a99bff;
  --grape:#5a3fd1;
  --night:#120c24;
  --ok:#2bb673;
  --warn:#ffb020;
  --bad:#ff4d5e;
  --os-face:#d9d3ea;
  --os-hi:#ffffff;
  --os-lo:#7d74a0;
  --os-dark:#3a3158;
  --os-title1:#2c1f8f;
  --os-title2:#c04ad8;
  --font-display:"Audiowide","Arial Black",Impact,sans-serif;
  --font-ui:"Chakra Petch","Trebuchet MS","Segoe UI",sans-serif;
  --font-pixel:"Pixelify Sans","Courier New",monospace;
  --font-term:"VT323","Courier New",monospace;
  --sat:env(safe-area-inset-top,0px);
  --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px);
  --sar:env(safe-area-inset-right,0px);
  color-scheme:light;
}
html,body{height:100%;overflow:hidden;background:var(--night);color:var(--ink)}
body{font-family:var(--font-ui);-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--aqua);outline-offset:2px}

#game{position:fixed;inset:0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;z-index:1}
#ytHost{position:fixed;left:0;top:0;width:0;height:0;z-index:0;pointer-events:none}
#ytHost iframe{position:absolute;left:0;top:0;border:0;transform-origin:0 0;background:#000;display:block}
#ytHost.off{visibility:hidden}
#ytHost.big{z-index:37;pointer-events:auto;overflow:hidden;border-radius:10px;background:#000}
#ytHost.full{z-index:72;width:100%;height:100%;pointer-events:auto;background:#000}
#fsExit{position:fixed;top:calc(10px + var(--sat));right:calc(10px + var(--sar));z-index:73;min-height:38px;padding:4px 12px;font-size:13px;opacity:.85}
#fsExit[hidden]{display:none}
.yt-now{display:flex;flex-direction:column;gap:2px;margin-top:10px;padding:8px 10px;border:2px solid var(--ink);border-radius:10px;background:#fff}
.yt-now b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.img-prev{width:84px;height:84px;flex:none;border:2.5px solid var(--ink);border-radius:10px;background:#efeaff}
a.btn{text-decoration:none;color:inherit}
.yt-warn{margin:8px 0 0;padding:8px 10px;border:2px dashed var(--bad);border-radius:10px;background:#fff1f3;font-size:13px;line-height:1.4}
.yt-way{display:flex;flex-direction:column;align-items:flex-start;gap:6px;margin-top:8px;padding:10px;border:2px solid var(--ink);border-radius:12px;background:#f7f4ff}
.yt-way b{font-size:14px}
.yt-way span{font-size:13px;line-height:1.4}
.yt-steps{margin:0;padding-left:20px;font-size:13px;line-height:1.45}
.yt-steps a{color:var(--grape);font-weight:700}
.yts{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.yts-item{display:flex;gap:10px;align-items:flex-start;width:100%;padding:6px;border:2px solid var(--ink);border-radius:10px;background:#fff;text-align:left;box-shadow:2px 2px 0 var(--ink)}
.yts-item:active{transform:translate(2px,2px);box-shadow:none}
.yts-item img,.yts-noimg{width:96px;height:54px;flex:none;object-fit:cover;border-radius:6px;background:#1d1433;display:block}
.yts-meta{display:flex;flex-direction:column;gap:3px;min-width:0}
.yts-meta b{font-size:13px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.yts-meta span{font-size:12px;font-weight:600;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* couch view: sitting back, the TV fills the view and a small remote bar replaces the HUD */
#couchBar{position:fixed;left:0;right:0;margin:0 auto;width:max-content;bottom:calc(12px + var(--sab));z-index:22;display:flex;align-items:center;gap:6px;padding:6px;border:2.5px solid var(--ink);border-radius:18px;background:linear-gradient(180deg,#f7f3ff,#e2dcf7);box-shadow:3px 3px 0 var(--ink);max-width:calc(100vw - 16px)}
#couchBar[hidden],#couchBar .btn[hidden]{display:none}
#couchBar .btn{flex:none;height:42px;min-height:42px;padding:0 12px;border-radius:12px;box-shadow:2px 2px 0 var(--ink);font-size:14px}
#couchBar .btn.ic{width:42px;padding:0}
#couchBar svg{width:18px;height:18px}
.cb-tune{display:flex;align-items:center;gap:4px;min-width:0}
.cb-ch{display:flex;flex-direction:column;justify-content:center;min-width:44px;max-width:150px;padding:0 4px;line-height:1.05}
.cb-ch b{font-family:var(--font-term);font-size:21px;font-weight:400;white-space:nowrap}
.cb-ch span{font-size:11px;font-weight:700;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.couchview .hud-tl > :not(#partyPill),body.couchview .hud-tr,body.couchview .hud-rail,body.couchview #emoteBar,body.couchview #mini,body.couchview #prompt,body.couchview #useBtn{display:none!important}
@media (max-width:420px){#couchBar{gap:4px;padding:5px}#couchBar .btn{padding:0 9px;font-size:13px}#couchBar .btn.ic{width:40px}.cb-ch{min-width:40px;max-width:60px}.cb-ch span{display:none}#couchBar.media .cb-ch{display:none}#couchBar.party .cb-tune{display:none}}
/* watch party: room pill, reactions tray over the couch bar, floating emoji, the party panel */
.party-chip{display:flex;align-items:center;gap:7px;padding:3px 12px 3px 8px;border:2.5px solid var(--ink);border-radius:999px;background:var(--bubble);color:#fff;box-shadow:3px 3px 0 var(--ink);font-family:var(--font-term);font-size:21px;line-height:1.1;white-space:nowrap;position:relative}
.party-chip[hidden]{display:none}
.party-chip::before{content:"";width:10px;height:10px;flex:none;border-radius:50%;background:var(--lime);border:2px solid var(--ink)}
.party-chip.unread::after{content:"";position:absolute;top:-5px;right:-5px;width:13px;height:13px;border-radius:50%;background:#ffd400;border:2px solid var(--ink)}
#couchBar .btn.on{background:var(--lime)}
#reactTray{position:fixed;left:0;right:0;margin:0 auto;width:max-content;max-width:calc(100vw - 16px);bottom:calc(74px + var(--sab));z-index:22;display:flex;align-items:center;gap:6px;padding:6px;border:2.5px solid var(--ink);border-radius:16px;background:linear-gradient(180deg,#fff,#ffe3f3);box-shadow:3px 3px 0 var(--ink)}
#reactTray[hidden]{display:none}
#reactTray .btn{flex:none;height:42px;min-height:42px;padding:0 12px;border-radius:12px;box-shadow:2px 2px 0 var(--ink);font-size:14px}
#reactTray .btn.ic{width:42px;padding:0;font-size:22px}
@media (max-width:420px){#reactTray{gap:4px;padding:5px}#reactTray .btn.ic{width:38px;font-size:20px}#reactTray .btn{padding:0 9px}}
#partyFx{position:fixed;inset:0;pointer-events:none;z-index:74;overflow:hidden}
.pfloat{position:absolute;bottom:calc(120px + var(--sab));display:flex;flex-direction:column;align-items:center;gap:2px;animation:pfloat 2.6s ease-out forwards}
.pfloat .pe{font-size:40px;line-height:1;filter:drop-shadow(2px 2px 0 var(--ink))}
.pfloat small{font-size:11px;font-weight:700;color:#fff;background:var(--ink);padding:1px 7px;border-radius:999px;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@keyframes pfloat{0%{transform:translate(-50%,24px) scale(.5);opacity:0}12%{transform:translate(-50%,0) scale(1.15);opacity:1}70%{opacity:1}100%{transform:translate(calc(-50% + var(--dx,0px)),-42vh) scale(1);opacity:0}}
@keyframes pfade{0%,75%{opacity:1;transform:translate(-50%,-14vh)}100%{opacity:0;transform:translate(-50%,-14vh)}}
@media (prefers-reduced-motion:reduce){.pfloat{animation:pfade 2.6s linear forwards!important}}
body.ytfull #toasts{z-index:75}
.panel-foot:empty{display:none}
.party-room{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px;border:2.5px solid var(--ink);border-radius:14px;background:linear-gradient(180deg,#fff,#ffe3f3);text-align:center}
.pr-lcd{display:flex;align-items:baseline;justify-content:center;gap:12px;align-self:stretch;padding:6px 12px;border-radius:10px;background:#1c0b16;color:#ff3b6b;font-family:var(--font-term);text-shadow:0 0 6px rgba(255,59,107,.7)}
.pr-lcd span{font-size:18px;letter-spacing:.12em}
.pr-lcd b{font-size:46px;font-weight:400;line-height:1;letter-spacing:.14em}
.party-link{font-size:12px;font-weight:600;color:var(--grape);overflow-wrap:anywhere;user-select:all;-webkit-user-select:all}
.party-now .pn-title{display:block;margin:2px 0;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.party-now .yt-warn{margin-top:8px}
.party-who{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.party-who .chip i{width:9px;height:9px;flex:none;border-radius:50%;background:var(--ok);border:1.5px solid var(--ink)}
.party-who .chip.me{background:var(--lime)}
.party-who .chip.away{opacity:.65}
.party-who .chip.away i{background:#c9c0e8}
.party-react{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.party-react .btn{padding:0;min-height:44px;font-size:22px}
.party-chat{display:flex;flex-direction:column;gap:8px}
.party-log{height:150px;overflow:auto;padding:8px 10px;border:2.5px solid var(--ink);border-radius:12px;background:#fff;display:flex;flex-direction:column;gap:4px;font-size:14px;line-height:1.35}
.party-log .pm{overflow-wrap:anywhere}
.party-log .pm b{color:var(--grape)}
.party-log .pm.me b{color:#c4001d}
#game canvas{display:block;width:100%;height:100%}
#scan{position:fixed;inset:0;pointer-events:none;z-index:5;background:repeating-linear-gradient(to bottom,rgba(20,10,40,.07) 0 1px,transparent 1px 3px);mix-blend-mode:multiply}
#vignette{position:fixed;inset:0;pointer-events:none;z-index:4;background:radial-gradient(120% 90% at 50% 45%,transparent 60%,rgba(18,12,36,.35) 100%)}
#fade{position:fixed;inset:0;background:#05020c;opacity:0;pointer-events:none;z-index:60;transition:opacity .6s ease;display:grid;place-items:center;color:#cfc6ff;font-family:var(--font-display);font-size:28px;letter-spacing:.08em}

/* ---------- shared sticker controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:8px 14px;border:2.5px solid var(--ink);border-radius:12px;background:var(--paper);box-shadow:3px 3px 0 var(--ink);font-weight:700;letter-spacing:.01em;transition:transform .06s ease,box-shadow .06s ease;touch-action:manipulation}
.btn:active,.btn.on{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.primary{background:var(--aqua)}
.btn.pink{background:var(--bubble);color:#fff}
.btn.tang{background:var(--tang)}
.btn.lime{background:var(--lime)}
.btn.lilac{background:var(--lilac)}
.btn.ghost{background:transparent;box-shadow:none}
.btn.sm{min-height:32px;padding:4px 10px;font-size:13px;border-radius:10px;box-shadow:2px 2px 0 var(--ink)}
.btn[disabled]{opacity:.45;pointer-events:none}
.iconbtn{width:44px;height:44px;padding:0;border-radius:14px}
.iconbtn svg{width:22px;height:22px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border:2px solid var(--ink);border-radius:999px;background:var(--paper);font-size:12px;font-weight:700}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600}
.field input,.field select,.field textarea,.inp{border:2.5px solid var(--ink);border-radius:10px;background:#fff;padding:8px 10px;min-height:40px;font-size:15px;width:100%}
.inp:focus,.field input:focus,.field textarea:focus{outline:none;border-color:var(--grape);box-shadow:0 0 0 3px var(--lilac)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:10px}
.muted{color:var(--ink-soft);font-size:13px}
.num{font-variant-numeric:tabular-nums}
.label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--ink-soft)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}

/* ---------- start screen ---------- */
#start{position:fixed;inset:0;z-index:70;display:grid;place-items:center;overflow-y:auto;padding:calc(24px + var(--sat)) 16px calc(24px + var(--sab));background:radial-gradient(80% 60% at 50% 30%,rgba(169,155,255,.35),transparent 70%),linear-gradient(180deg,rgba(18,12,36,.55),rgba(18,12,36,.9));transition:opacity .5s ease}
#start.gone{opacity:0;pointer-events:none}
.start-card{width:min(560px,100%);display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center;color:#fff}
.logo{font-family:var(--font-display);font-size:clamp(30px,min(11vw,13vh),84px);line-height:.95;letter-spacing:.02em;text-wrap:balance;background:linear-gradient(180deg,#fff 0%,#dff8ff 38%,#7fd8ff 48%,#2b1c6e 52%,#a99bff 70%,#fff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:2px var(--ink);filter:drop-shadow(4px 5px 0 var(--bubble)) drop-shadow(0 0 22px rgba(34,209,230,.5))}
.tagline{font-family:var(--font-pixel);font-size:18px;color:#e9e3ff;max-width:34ch}
.start-btn{font-family:var(--font-display);font-size:22px;padding:14px 34px;min-height:58px;background:linear-gradient(180deg,#8ff3ff,var(--aqua));border-radius:999px;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.05)}}
.start-hints{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
@media (max-height:460px){.start-card{gap:10px}.tagline{display:none}.start-btn{min-height:48px;padding:8px 26px}}
.start-hints .chip{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.5)}
.loadbar{width:220px;height:10px;border:2px solid #fff;border-radius:999px;overflow:hidden}
.loadbar i{display:block;height:100%;width:0;background:var(--bubble);transition:width .2s}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:20}
#hud > *{pointer-events:auto}
.hud-tl{position:absolute;top:calc(10px + var(--sat));left:calc(10px + var(--sal));display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.hud-tr{position:absolute;top:calc(10px + var(--sat));right:calc(10px + var(--sar));display:flex;gap:8px}
.hud-clock{display:flex;align-items:center;gap:10px;padding:6px 12px 6px 8px;border:2.5px solid var(--ink);border-radius:14px;background:var(--paper);box-shadow:3px 3px 0 var(--ink)}
.hud-clock .lcd{font-family:var(--font-term);font-size:30px;line-height:1;color:#ff3b6b;background:#1c0b16;padding:2px 8px;border-radius:6px;min-width:84px;text-align:center;text-shadow:0 0 6px rgba(255,59,107,.7)}
.hud-clock .where{display:flex;flex-direction:column;line-height:1.1}
.hud-clock .where b{font-family:var(--font-display);font-size:13px;letter-spacing:.04em}
.hud-clock .where span{font-size:11px;color:var(--ink-soft);font-weight:600}
.vibes{display:flex;align-items:center;gap:8px;padding:4px 10px 4px 4px;border:2.5px solid var(--ink);border-radius:999px;background:linear-gradient(90deg,#fff,#f1ecff);box-shadow:3px 3px 0 var(--ink);font-weight:700;font-size:13px}
.vibes .orb{width:26px;height:26px;border-radius:50%;border:2px solid var(--ink);background:radial-gradient(circle at 35% 30%,#fff 0 18%,var(--bubble) 45%,var(--grape) 100%)}
.vibes .bar{width:70px;height:8px;border:2px solid var(--ink);border-radius:999px;overflow:hidden;background:#fff}
.vibes .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--aqua),var(--bubble))}
.focus-chip{display:flex;align-items:center;gap:6px;padding:4px 10px;border:2.5px solid var(--ink);border-radius:999px;background:var(--tang);box-shadow:3px 3px 0 var(--ink);font-family:var(--font-term);font-size:22px}
.focus-chip[hidden]{display:none}

#prompt{position:absolute;left:50%;bottom:calc(132px + var(--sab));transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:8px 10px 8px 14px;border:2.5px solid var(--ink);border-radius:16px;background:var(--paper);box-shadow:3px 3px 0 var(--ink);font-weight:700;white-space:nowrap;max-width:calc(100vw - 32px)}
#prompt .what{display:flex;flex-direction:column;line-height:1.15;min-width:0}
#prompt .what small{font-weight:600;color:var(--ink-soft);font-size:12px;overflow:hidden;text-overflow:ellipsis}
#prompt kbd{font-family:var(--font-pixel);border:2px solid var(--ink);border-radius:6px;padding:0 6px;background:var(--lime)}

/* mini player */
#mini{position:absolute;left:50%;bottom:calc(12px + var(--sab));transform:translateX(-50%);width:min(560px,calc(100vw - 24px));display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border:2.5px solid var(--ink);border-radius:18px;background:linear-gradient(180deg,#f7f3ff,#e2dcf7);box-shadow:3px 3px 0 var(--ink)}
#mini .disc{width:44px;height:44px;border-radius:50%;border:2.5px solid var(--ink);background:conic-gradient(from 0deg,#e8e8f0,#9fe6ff,#ffb6e1,#fff4a8,#c9ffd1,#e8e8f0);position:relative;animation:spin 3s linear infinite;animation-play-state:paused}
#mini .disc::after{content:"";position:absolute;inset:15px;border-radius:50%;background:var(--paper);border:2px solid var(--ink)}
#mini.playing .disc{animation-play-state:running}
@keyframes spin{to{transform:rotate(360deg)}}
#mini .meta{min-width:0;display:flex;flex-direction:column;gap:2px}
#mini .meta .t{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mini .meta .a{font-size:12px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
#mini .meta canvas{width:100%;height:16px;display:block}
#mini .ctl{display:flex;gap:6px}
#mini .ctl .btn{width:38px;height:38px;min-height:38px;padding:0;border-radius:12px;box-shadow:2px 2px 0 var(--ink)}
#mini .ctl svg{width:18px;height:18px}
.station-tag{font-family:var(--font-pixel);font-size:11px;padding:0 6px;border-radius:4px;background:var(--ink);color:var(--lime);margin-right:4px}

@media (max-height:520px){body.panel-open #mini,body.panel-open #prompt{display:none}}
/* joystick */
#joy{position:fixed;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:2.5px solid rgba(255,255,255,.75);background:rgba(29,20,51,.25);pointer-events:none;z-index:25;display:none}
#joy i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(255,255,255,.85);border:2.5px solid var(--ink)}
body.touch #prompt{left:calc(12px + var(--sal));transform:none;max-width:calc(100vw - 120px)}
#useBtn{position:fixed;right:calc(16px + var(--sar));bottom:calc(132px + var(--sab));width:78px;height:78px;border-radius:50%;font-family:var(--font-display);font-size:16px;z-index:22;background:var(--lime)}
#tapmark{position:fixed;width:34px;height:34px;margin:-17px 0 0 -17px;border:3px solid #fff;border-radius:50%;pointer-events:none;z-index:6;opacity:0}
#tapmark.go{animation:tap .55s ease-out}
@keyframes tap{from{opacity:1;transform:scale(.4)}to{opacity:0;transform:scale(1.6)}}

/* toasts */
#toasts{position:fixed;top:calc(70px + var(--sat));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;z-index:65;pointer-events:none;width:min(420px,calc(100vw - 32px))}
.toast{display:flex;align-items:center;gap:10px;padding:8px 14px;border:2.5px solid var(--ink);border-radius:14px;background:var(--paper);box-shadow:3px 3px 0 var(--ink);font-weight:700;font-size:14px;animation:toastIn .25s ease-out}
.toast b{font-family:var(--font-display);font-size:12px;letter-spacing:.06em;color:var(--grape)}
.toast.vibe{background:linear-gradient(90deg,#fff,#ffe3f3)}
@keyframes toastIn{from{transform:translateY(-10px);opacity:0}}

/* ---------- activity panels ---------- */
#panelWrap{position:fixed;inset:0;z-index:40;pointer-events:none}
.panel{pointer-events:auto;position:absolute;right:calc(16px + var(--sar));top:calc(16px + var(--sat));bottom:calc(16px + var(--sab));width:min(430px,calc(100vw - 32px));display:flex;flex-direction:column;border:3px solid var(--ink);border-radius:22px;background:var(--paper);box-shadow:6px 6px 0 var(--ink);overflow:hidden;animation:panelIn .28s cubic-bezier(.2,1.3,.4,1)}
.panel.center{left:50%;right:auto;transform:translateX(-50%);animation:none;width:min(520px,calc(100vw - 32px))}
.panel.short{bottom:auto;max-height:calc(100% - 32px - var(--sat) - var(--sab))}
@keyframes panelIn{from{transform:translateX(30px);opacity:0}}
.panel-head{display:flex;align-items:center;gap:10px;padding:12px 12px 12px 16px;border-bottom:3px solid var(--ink);background:var(--acc,var(--aqua));position:relative}
.panel-head::after{content:"";position:absolute;left:0;right:0;bottom:-3px;height:3px;background:repeating-linear-gradient(90deg,var(--ink) 0 10px,transparent 10px 14px);opacity:.25}
.panel-head h2{margin:0;font-family:var(--font-display);font-size:19px;letter-spacing:.03em;line-height:1.1;text-wrap:balance}
.panel-head p{margin:2px 0 0;font-size:12px;font-weight:600;opacity:.85}
.panel-head .grow{flex:1;min-width:0}
.panel-body{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:14px;-webkit-overflow-scrolling:touch}
.panel-body > *{flex-shrink:0}
.panel-foot{padding:10px 16px;border-top:2.5px solid var(--ink);display:flex;gap:8px;flex-wrap:wrap;background:var(--paper-2)}
.card{border:2.5px solid var(--ink);border-radius:14px;padding:12px;background:#fff}
.card h3{margin:0 0 6px;font-size:15px;font-family:var(--font-display);letter-spacing:.02em}
.irl{border:2.5px dashed var(--grape);border-radius:14px;padding:10px 12px;background:#f4f0ff;font-size:13px;line-height:1.45}
.irl b{font-family:var(--font-display);font-size:11px;letter-spacing:.1em;color:var(--grape);display:block;margin-bottom:2px}
@media (max-width:720px){
  .panel,.panel.center{left:8px;right:8px;width:auto;transform:none;top:auto;bottom:calc(8px + var(--sab));max-height:56%;border-radius:20px;animation:sheetIn .3s cubic-bezier(.2,1.2,.4,1)}
  .panel.tall{max-height:calc(100% - 70px - var(--sat))}
  .panel.short{bottom:calc(8px + var(--sab))}
  @keyframes sheetIn{from{transform:translateY(40px);opacity:0}}
  #prompt{bottom:calc(122px + var(--sab))}
}

.panel.collapsed{top:auto!important;bottom:calc(84px + var(--sab))!important;left:50%!important;right:auto!important;transform:translateX(-50%)!important;width:auto!important;max-width:calc(100vw - 24px);max-height:none!important;animation:none}
.panel.collapsed .panel-body,.panel.collapsed .panel-foot,.panel.collapsed .panel-head p{display:none}
.panel.collapsed .panel-head{border-bottom:0;padding:8px 8px 8px 14px}
.panel.collapsed .panel-head h2{font-size:15px;white-space:nowrap}
.panel.collapsed .panel-head > svg{display:none}
.hidebtn{min-width:58px}
/* menu & activity list */
.act-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.act{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:10px;border:2.5px solid var(--ink);border-radius:12px;background:#fff;box-shadow:2px 2px 0 var(--ink);min-height:62px}
.act b{font-size:14px}
.act span{font-size:12px;color:var(--ink-soft);font-weight:600}
.act .room{font-family:var(--font-pixel);font-size:11px;padding:0 6px;border-radius:4px;color:#fff;background:var(--grape)}
.mission{display:flex;align-items:center;gap:10px;padding:8px 10px;border:2px solid var(--ink);border-radius:10px;background:#fff}
.mission .box{width:22px;height:22px;border:2.5px solid var(--ink);border-radius:6px;flex:none;display:grid;place-items:center}
.mission.done .box{background:var(--lime)}
.mission .pg{margin-left:auto;font-family:var(--font-term);font-size:20px}

/* pager */
.pager{background:#2a2f2a;border:3px solid var(--ink);border-radius:18px;padding:12px;box-shadow:inset 0 -6px 0 rgba(0,0,0,.25)}
.pager .scr{background:#b9d48a;border:2px solid #1d2416;border-radius:8px;padding:8px 10px;font-family:var(--font-term);font-size:22px;color:#1d2416;line-height:1.05;min-height:64px}

/* ---------- PC overlay ---------- */
#pc{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:calc(10px + var(--sat)) 10px calc(10px + var(--sab));background:rgba(10,6,22,.72);opacity:0;pointer-events:none;transition:opacity .35s ease}
#pc.open{opacity:1;pointer-events:auto}
.bezel{position:relative;width:min(1100px,100%);height:min(760px,100%);padding:22px 22px 44px;border:3px solid var(--ink);border-radius:26px 26px 30px 30px;background:linear-gradient(180deg,#efe6cf,#d9cdb0);box-shadow:inset 0 3px 0 #fff8e6,inset 0 -6px 0 #b7a985,8px 8px 0 var(--ink);display:flex}
.bezel .brand{position:absolute;left:28px;bottom:10px;font-family:var(--font-display);font-size:12px;letter-spacing:.2em;color:#7c6f52}
.bezel .led{position:absolute;right:30px;bottom:15px;width:12px;height:12px;border-radius:50%;background:#53ff7a;box-shadow:0 0 8px #53ff7a;border:2px solid var(--ink)}
.bezel .standup{position:absolute;right:56px;bottom:6px;min-height:30px;padding:2px 12px;font-size:12px}
.screen{position:relative;flex:1;min-width:0;border:3px solid var(--ink);border-radius:18px;overflow:hidden;background:#000;box-shadow:inset 0 0 40px rgba(0,0,0,.6)}
.screen::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(to bottom,rgba(0,0,0,.08) 0 1px,transparent 1px 3px),radial-gradient(130% 110% at 50% 50%,transparent 70%,rgba(0,0,0,.35));z-index:30;border-radius:15px}
@media (max-width:720px){.bezel{padding:10px 10px 38px;border-radius:20px}.bezel .brand{left:16px;font-size:10px}.screen{border-radius:12px}}

.desk{position:absolute;inset:0;font-family:var(--font-pixel);color:#111;background:radial-gradient(circle at 78% 22%,rgba(255,255,255,.35) 0 6%,transparent 7%),radial-gradient(120% 90% at 20% 110%,#ff8fd0 0%,transparent 55%),linear-gradient(160deg,#2ad0c9 0%,#3a7bd5 45%,#6b4bd6 100%);overflow:hidden}
.desk .wall-logo{position:absolute;right:6%;bottom:16%;font-family:var(--font-display);font-size:clamp(22px,4.5vw,46px);color:rgba(255,255,255,.22);text-align:right;line-height:1;pointer-events:none}
.icons{position:absolute;top:10px;left:8px;bottom:46px;display:grid;grid-auto-flow:column;grid-template-rows:repeat(auto-fill,82px);grid-auto-columns:84px;gap:2px 4px;align-content:start}
.dicon{display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 2px;border:1px dashed transparent;background:none;color:#fff;font-size:12px;text-align:center;line-height:1.1;text-shadow:1px 1px 0 #000}
.dicon:hover,.dicon:focus-visible{border-color:rgba(255,255,255,.7);background:rgba(20,10,80,.35);outline:none}
.dicon svg{width:40px;height:40px;filter:drop-shadow(2px 2px 0 rgba(0,0,0,.45))}
.taskbar{position:absolute;left:0;right:0;bottom:0;height:40px;display:flex;align-items:center;gap:4px;padding:3px 4px;background:var(--os-face);border-top:2px solid var(--os-hi);box-shadow:inset 0 -1px 0 var(--os-lo);z-index:20}
.startb{display:flex;align-items:center;gap:6px;height:32px;padding:0 10px;font-weight:700;font-family:var(--font-pixel);background:var(--os-face);border:2px solid;border-color:var(--os-hi) var(--os-dark) var(--os-dark) var(--os-hi);font-size:15px}
.startb.on{border-color:var(--os-dark) var(--os-hi) var(--os-hi) var(--os-dark)}
.startb i{width:18px;height:18px;border-radius:50%;background:conic-gradient(var(--bubble) 0 25%,var(--aqua) 0 50%,var(--lime) 0 75%,var(--tang) 0)}
.tasks{flex:1;display:flex;gap:4px;min-width:0;overflow:hidden}
.taskb{height:30px;min-width:0;max-width:150px;flex:1;padding:0 8px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--os-face);border:2px solid;border-color:var(--os-hi) var(--os-dark) var(--os-dark) var(--os-hi);font-size:13px}
.taskb.on{border-color:var(--os-dark) var(--os-hi) var(--os-hi) var(--os-dark);background:#e9e5f5}
.tray{display:flex;align-items:center;gap:8px;height:30px;padding:0 10px;border:2px solid;border-color:var(--os-lo) var(--os-hi) var(--os-hi) var(--os-lo);font-size:14px}
.startmenu{position:absolute;left:4px;bottom:42px;width:230px;display:flex;background:var(--os-face);border:2px solid;border-color:var(--os-hi) var(--os-dark) var(--os-dark) var(--os-hi);z-index:25;max-height:calc(100% - 50px)}
.startmenu .side{width:30px;background:linear-gradient(0deg,var(--os-title1),var(--os-title2));color:#fff;writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--font-display);font-size:14px;padding:8px 4px;letter-spacing:.1em}
.startmenu ul{list-style:none;margin:0;padding:3px;flex:1;overflow:auto}
.startmenu li button{display:flex;align-items:center;gap:8px;width:100%;padding:5px 8px;background:none;border:0;text-align:left;font-size:14px}
.startmenu li button:hover,.startmenu li button:focus-visible{background:var(--os-title1);color:#fff;outline:none}
.startmenu li button svg{width:22px;height:22px;flex:none}
.startmenu hr{border:0;border-top:1px solid var(--os-lo);border-bottom:1px solid var(--os-hi);margin:3px 0}
.win{position:absolute;display:flex;flex-direction:column;min-width:260px;background:var(--os-face);border:2px solid;border-color:var(--os-hi) var(--os-dark) var(--os-dark) var(--os-hi);box-shadow:2px 2px 0 rgba(0,0,0,.35);z-index:10}
.win.max{left:0!important;top:0!important;width:100%!important;height:calc(100% - 40px)!important;min-width:0}
.win .tb{display:flex;align-items:center;gap:6px;height:28px;padding:0 3px 0 6px;color:#fff;background:linear-gradient(90deg,var(--os-title1),var(--os-title2));font-weight:700;font-size:14px;cursor:grab;touch-action:none;flex:none}
.win.blur .tb{background:linear-gradient(90deg,#77708f,#a39cbb)}
.win .tb svg{width:18px;height:18px;flex:none}
.win .tb span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.win .tb button{width:24px;height:22px;padding:0;display:grid;place-items:center;background:var(--os-face);color:#111;border:2px solid;border-color:var(--os-hi) var(--os-dark) var(--os-dark) var(--os-hi);font-family:var(--font-pixel);font-size:13px;line-height:1}
.win .wb{flex:1;min-height:0;overflow:auto;margin:3px;background:#fff;border:2px solid;border-color:var(--os-lo) var(--os-hi) var(--os-hi) var(--os-lo);font-family:var(--font-ui);font-size:14px;position:relative}
.win .wb.flat{background:var(--os-face);border:0}
.osbtn{min-height:30px;padding:3px 12px;background:var(--os-face);color:#1d1433;border:2px solid;border-color:var(--os-hi) var(--os-dark) var(--os-dark) var(--os-hi);font-family:var(--font-pixel);font-size:14px}
.osbtn:active,.osbtn.on{border-color:var(--os-dark) var(--os-hi) var(--os-hi) var(--os-dark)}
.osbtn.big{min-height:38px;font-size:16px}
.osin{min-height:30px;padding:3px 8px;border:2px solid;border-color:var(--os-lo) var(--os-hi) var(--os-hi) var(--os-lo);background:#fff;font-family:var(--font-ui);font-size:15px;width:100%}
.boot{position:absolute;inset:0;background:#000;color:#bdbdbd;font-family:var(--font-term);font-size:20px;padding:18px;z-index:28;line-height:1.15;white-space:pre-wrap;overflow:hidden}
.boot .splash{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(160deg,#2ad0c9,#6b4bd6);color:#fff;font-family:var(--font-display);font-size:clamp(26px,6vw,54px);text-shadow:3px 3px 0 var(--ink)}

/* touch sizing for the retro OS */
body.touch .win .tb{height:38px;font-size:15px}
body.touch .win .tb button{width:38px;height:32px;font-size:18px}
body.touch .taskbar{height:46px}
body.touch .startb,body.touch .taskb{height:38px}
body.touch .win.max{height:calc(100% - 46px)!important}
body.touch .startmenu{bottom:48px}
body.touch .startmenu li button{padding:9px 10px;font-size:16px}
body.touch .osbtn{min-height:40px;padding:6px 14px}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0);pointer-events:none}
.filebtn{display:inline-flex;align-items:center;cursor:pointer;position:relative}
/* radio app */
.fm{display:flex;flex-direction:column;height:100%;background:#1a1530;color:#e8e4ff;font-family:var(--font-ui)}
.fm-top{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;padding:10px;background:linear-gradient(180deg,#2b2350,#1a1530)}
.fm-lcd{background:#0d1b10;border:2px solid #000;border-radius:6px;padding:8px 10px;font-family:var(--font-term);color:#7dff8e;text-shadow:0 0 6px rgba(125,255,142,.6);display:flex;flex-direction:column;gap:2px;min-width:0}
.fm-lcd .big{font-size:26px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fm-lcd .sm{font-size:18px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fm-viz{width:100%;height:90px;display:block;background:#07040f;border:2px solid #000;border-radius:6px}
.fm-ctl{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.fm-ctl input[type=range]{flex:1;min-width:90px;accent-color:var(--bubble)}
.fm-tabs{display:flex;gap:4px;padding:6px 10px 0;background:#1a1530}
.fm-tabs button{padding:6px 12px;border:2px solid #4a3f7a;border-bottom:0;border-radius:8px 8px 0 0;background:#241d42;color:#cfc8ff;font-family:var(--font-pixel)}
.fm-tabs button.on{background:#332a5e;color:#fff}
.fm-body{flex:1;overflow:auto;padding:10px;background:#332a5e;display:flex;flex-direction:column;gap:8px}
.preset{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border:2px solid #4a3f7a;border-radius:10px;background:#241d42;color:#fff;text-align:left;width:100%}
.preset.on{border-color:var(--lime);box-shadow:0 0 0 2px rgba(184,240,58,.35)}
.preset .n{font-family:var(--font-term);font-size:22px;color:var(--lime);min-width:52px;white-space:nowrap}
.preset b{display:block;font-size:14px}
.preset span{font-size:12px;opacity:.75}
.preset em{font-style:normal;font-family:var(--font-pixel);font-size:12px;opacity:.7}
.trk{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 8px;border-radius:8px;background:#241d42}
.trk.on{outline:2px solid var(--aqua)}
.trk .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.fm a{color:var(--aqua)}

/* chat app */
.im{display:flex;flex-direction:column;height:100%;background:#fff;font-family:Arial,Helvetica,sans-serif}
.im-log{flex:1;overflow:auto;padding:10px;font-size:14px;line-height:1.4;display:flex;flex-direction:column;gap:6px}
.im-log .m b{font-weight:700}
.im-log .m.me b{color:#c4001d}
.im-log .m.bot b{color:#0026c4}
.im-log .m.sys{color:#777;font-style:italic;font-size:12px}
.im-log .m p{margin:0;display:inline;white-space:pre-wrap}
.im-in{display:flex;gap:6px;padding:6px;border-top:2px solid var(--os-lo);background:var(--os-face)}
.im-in textarea{flex:1;min-height:44px;max-height:110px;resize:none}

/* games */
.gamebox{display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px;height:100%;background:#191326;color:#fff;font-family:var(--font-pixel)}
.gamebox canvas{max-width:100%;image-rendering:pixelated;border:2px solid #000;background:#0b0816;touch-action:none}
.gamebox .hdr{display:flex;gap:14px;justify-content:center;font-size:16px;flex-wrap:wrap}
.dpad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,46px);gap:4px}
.dpad button{background:#3a2d63;color:#fff;border:2px solid #000;border-radius:8px;font-size:18px}
.mines{display:grid;gap:2px;background:#7d74a0;padding:3px;border:2px solid;border-color:var(--os-lo) var(--os-hi) var(--os-hi) var(--os-lo)}
.mines button{width:30px;height:30px;padding:0;font-family:var(--font-pixel);font-weight:700;font-size:16px;background:var(--os-face);border:2px solid;border-color:var(--os-hi) var(--os-dark) var(--os-dark) var(--os-hi);display:grid;place-items:center}
.mines button.r{background:#ece8f6;border:1px solid #b3abc9}
.mines button.boom{background:var(--bad)}
.memo{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;width:min(340px,100%)}
.memo button{aspect-ratio:1;border:2px solid #000;border-radius:10px;background:linear-gradient(135deg,var(--grape),var(--bubble));display:grid;place-items:center;padding:6px;transition:transform .25s}
.memo button.up,.memo button.ok{background:#fff}
.memo button.ok{opacity:.55}
.memo button svg{width:100%;height:100%}
.type-text{font-family:var(--font-ui);font-size:18px;line-height:1.5;background:#fff;color:#999;padding:12px;border:2px solid #000;border-radius:8px;max-width:520px;width:100%}
.type-text .ok{color:#151}
.type-text .no{color:#fff;background:var(--bad)}
.type-text .cur{border-left:2px solid var(--grape)}

/* beat pad */
#beat{position:fixed;inset:0;z-index:45;pointer-events:none;display:none}
#beat.on{display:block}
#beat canvas{position:absolute;inset:0;width:100%;height:100%}
#beat .bp-ui{pointer-events:auto;position:absolute;top:calc(12px + var(--sat));right:calc(12px + var(--sar));display:flex;gap:8px}
#beat .lanes{pointer-events:auto;position:absolute;left:50%;transform:translateX(-50%);bottom:calc(12px + var(--sab));display:grid;grid-template-columns:repeat(4,72px);gap:8px}
#beat .lanes button{height:72px;border:3px solid var(--ink);border-radius:16px;background:rgba(255,255,255,.9);box-shadow:3px 3px 0 var(--ink);display:grid;place-items:center}
#beat .lanes svg{width:36px;height:36px}
@media (min-width:900px) and (hover:hover){#beat .lanes{display:none}}

/* closet */
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{display:flex;align-items:center;gap:6px;padding:6px 10px;border:2.5px solid var(--ink);border-radius:12px;background:#fff;font-size:13px;font-weight:700;box-shadow:2px 2px 0 var(--ink)}
.opt.on{background:var(--lime)}
.opt.lock{opacity:.6;background:#eee;box-shadow:none}
.opt i{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink);flex:none}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.tabs .btn{flex:none}

/* breathe */
.breath{display:grid;place-items:center;height:220px;position:relative}
.breath .ring{width:200px;height:200px;border-radius:50%;border:3px dashed var(--grape);position:absolute}
.breath .ball{width:80px;height:80px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,var(--aqua) 50%,var(--grape));border:3px solid var(--ink);transition:transform linear}
.breath .cue{position:absolute;font-family:var(--font-display);font-size:20px;color:var(--ink)}
.timer-big{font-family:var(--font-term);font-size:64px;line-height:1;text-align:center}
.cups{display:flex;flex-wrap:wrap;gap:6px}
.cup{width:34px;height:42px;border:2.5px solid var(--ink);border-radius:4px 4px 10px 10px;background:#fff;position:relative;overflow:hidden}
.cup.full::after{content:"";position:absolute;left:0;right:0;bottom:0;height:75%;background:linear-gradient(180deg,#9df0ff,var(--aqua))}
.hgrid{display:grid;gap:4px;font-size:12px}
.hgrid button{width:100%;aspect-ratio:1;border:2px solid var(--ink);border-radius:6px;background:#fff;padding:0}
.hgrid button.on{background:var(--lime)}
.hgrid button.today{outline:2px solid var(--bubble);outline-offset:1px}
.moods{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.moods button{border:2.5px solid var(--ink);border-radius:12px;background:#fff;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700}
.moods button svg{width:34px;height:34px}
.moods button.on{background:var(--lime)}
.strip{display:flex;gap:4px}
.strip i{flex:1;height:18px;border:2px solid var(--ink);border-radius:4px}
.recipe{border:2.5px solid var(--ink);border-radius:14px;background:#fff;overflow:hidden}
.recipe summary{padding:10px 12px;font-weight:700;cursor:pointer;display:flex;gap:8px;align-items:center;list-style:none}
.recipe summary::-webkit-details-marker{display:none}
.recipe .rb{padding:0 12px 12px;font-size:14px;line-height:1.45}
.recipe ul,.recipe ol{margin:4px 0;padding-left:20px}
.bars{display:flex;flex-direction:column;gap:8px}
.bar-row{display:grid;grid-template-columns:70px minmax(0,1fr) 90px;gap:8px;align-items:center;font-size:13px;font-weight:700}
.bar-row .tr{height:14px;border:2px solid #000;background:#fff;position:relative}
.bar-row .tr i{position:absolute;left:0;top:0;bottom:0}
.bar-row .tr u{position:absolute;top:-4px;bottom:-4px;width:2px;background:#000}
/* ---------- video host + big screen ---------- */
#vidHost{position:fixed;left:0;bottom:0;width:2px;height:2px;opacity:.01;pointer-events:none;z-index:1;overflow:hidden}
#vidHost video{width:100%;height:100%;object-fit:contain;background:#000;display:block}
#vidHost.big{opacity:1;z-index:36;border-radius:10px;overflow:hidden}
#theater{position:fixed;z-index:35;display:flex;flex-direction:column;border:3px solid var(--ink);border-radius:20px;background:#2b2440;box-shadow:6px 6px 0 var(--ink);padding:8px;gap:8px}
#theater[hidden]{display:none}
.th-bar{display:flex;align-items:center;gap:6px}
.th-bar b{flex:1;min-width:0;color:#fff;font-family:var(--font-term);font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.th-bar button{min-width:38px;height:34px;border:2px solid var(--ink);border-radius:10px;background:var(--paper);font-weight:700;box-shadow:2px 2px 0 var(--ink)}
.th-bar button[hidden]{display:none}
.th-screen{flex:1;min-height:0;position:relative;border-radius:10px;overflow:hidden;background:#000;border:3px solid #120c24}
.th-screen canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.tvch{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px}
.tvch .btn{justify-content:flex-start}
.tvch .btn b{font-family:var(--font-term);font-size:18px}
.vtrk{display:flex;align-items:center;gap:8px;flex-wrap:nowrap;margin-top:6px;padding:4px 6px;border:2px solid var(--ink);border-radius:10px;background:#fff}
.vtrk.on{background:var(--lime)}
.vtrk .grow{flex:1;min-width:0;justify-content:flex-start;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;text-align:left}
.grow{flex:1;min-width:0}

/* ---------- HUD rail, emotes, buddy bubble ---------- */
.hud-rail{position:absolute;right:calc(10px + var(--sar));top:calc(64px + var(--sat));display:flex;flex-direction:column;gap:8px}
.hud-rail .btn.on{background:var(--lime)}
#emoteBar{position:absolute;right:calc(64px + var(--sar));top:calc(64px + var(--sat));display:grid;grid-template-columns:repeat(3,auto);gap:6px;padding:8px;border:2.5px solid var(--ink);border-radius:14px;background:var(--paper);box-shadow:3px 3px 0 var(--ink)}
#emoteBar[hidden]{display:none}
#buddyBubble{position:fixed;left:0;top:0;z-index:21;pointer-events:none;max-width:min(260px,70vw);padding:7px 11px;border:2.5px solid var(--ink);border-radius:14px;background:#fff;font-weight:700;font-size:13px;line-height:1.3;box-shadow:3px 3px 0 var(--ink)}
#buddyBubble::after{content:"";position:absolute;left:50%;bottom:-9px;width:12px;height:12px;background:#fff;border-right:2.5px solid var(--ink);border-bottom:2.5px solid var(--ink);transform:translateX(-50%) rotate(45deg)}
#buddyBubble[hidden]{display:none}
body.photo #hud,body.photo #buddyBubble,body.theater #buddyBubble{display:none}

/* ---------- buddy chat ---------- */
.bchat{height:min(52vh,430px);min-height:240px;border:2.5px solid var(--ink);border-radius:14px;overflow:hidden}
.im-head{padding:6px 10px;background:linear-gradient(90deg,#fff47a,#ffd400);border-bottom:2px solid #1d1433;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.im-in{display:flex;gap:6px;padding:6px;border-top:2px solid #d9d3ea}
.im-in textarea{resize:none;min-height:38px}
.im-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.im-chips .chip{cursor:pointer;background:#f4f0ff}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:34px;height:34px;border-radius:50%;border:2.5px solid var(--ink);box-shadow:2px 2px 0 var(--ink)}
.sw.on{outline:3px solid var(--grape);outline-offset:2px}

/* ---------- groovebox ---------- */
.panel.wide{width:min(600px,calc(100vw - 32px))}
.gb-grid{display:grid;gap:3px;align-items:center;user-select:none;-webkit-user-select:none}
.gb-name{font-size:11px;font-weight:700;padding-left:6px;border-left:5px solid var(--c);white-space:nowrap;overflow:hidden}
.gb-cell{height:30px;border:2px solid var(--ink);border-radius:6px;background:#fff;padding:0;touch-action:manipulation}
.gb-cell.q{background:#efeaff}
.gb-cell.on{background:var(--c);box-shadow:inset 0 0 0 2px rgba(255,255,255,.6)}
.gb-led{display:block;height:8px;border-radius:4px;background:#ddd6f3}
.gb-led.q{background:#c9bff0}
.gb-led.hot{background:var(--bubble)}
@media (max-width:720px){.gb-cell{height:34px}}

/* ---------- dj ---------- */
.dj-pads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.dj-pad{height:64px;border:3px solid var(--ink);border-radius:14px;background:var(--c);font-family:var(--font-display);font-size:13px;box-shadow:3px 3px 0 var(--ink);touch-action:manipulation;user-select:none;-webkit-user-select:none}
.dj-pad:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink);filter:brightness(1.2)}
.dj-sweep{width:100%}

/* ---------- synth ---------- */
.kb{position:relative;height:150px;touch-action:none;user-select:none;-webkit-user-select:none;border:3px solid var(--ink);border-radius:10px;overflow:hidden;background:var(--ink)}
.kw{position:absolute;top:0;bottom:0;background:#fff;border-right:2px solid var(--ink);display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;font-size:11px;font-weight:700;color:var(--ink-soft)}
.kbk{position:absolute;top:0;height:60%;background:var(--ink);border-radius:0 0 6px 6px;z-index:2;border:2px solid #000}
.kw:active,.kw.press{background:var(--aqua)}
.kbk:active,.kbk.press{background:var(--grape)}
.kw.next{background:var(--lime)}
.kbk.next{background:#5f8f1a}
.song-line{font-family:var(--font-term);font-size:22px;line-height:1.2;min-height:28px;text-align:center}
.song-line .done{color:#2bb673}
.song-line .cur{background:var(--lime);padding:0 4px;border-radius:4px}

/* ---------- arcade ---------- */
.cabwrap{display:flex;justify-content:center;padding:10px;background:#120c24;border:3px solid var(--ink);border-radius:16px}
.cabwrap .gamebox{background:transparent;padding:0}
.arcade-cv{width:min(100%,340px);aspect-ratio:3/4;height:auto;display:block;border:3px solid #000;border-radius:8px;touch-action:none;image-rendering:pixelated}
.cabwrap canvas.arcade-cv[width="300"][height="260"]{aspect-ratio:30/26}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:90px}
.bars > div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:2px}
.bars i{display:block;width:100%;background:var(--aqua);border:2px solid var(--ink);border-radius:4px}
.bars span{font-size:11px;font-weight:700}

/* ---------- bathroom ---------- */
.quad{display:grid;grid-template-columns:repeat(2,34px);gap:4px}
.quad i{height:28px;border:2.5px solid var(--ink);border-radius:8px;background:#fff}
.quad i.on{background:var(--aqua)}
.affirm{font-family:var(--font-display);font-size:20px;line-height:1.3;text-align:center;padding:12px 4px}
.snack{font-family:var(--font-display);font-size:16px;padding:10px;border:2.5px dashed var(--ink);border-radius:12px;background:#fffbe0;text-align:center}

/* ---------- photo mode ---------- */
#photoUI{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none}
#photoUI[hidden]{display:none}
#photoUI > *{pointer-events:auto}
.ph-top{display:flex;justify-content:space-between;align-items:center;padding:calc(10px + var(--sat)) 12px 10px;background:linear-gradient(180deg,rgba(18,12,36,.7),transparent);color:#fff;font-family:var(--font-display)}
.ph-top .btn{color:var(--ink)}
.ph-view{flex:1;pointer-events:none!important;display:grid;place-items:center;box-shadow:inset 0 0 0 3px rgba(255,255,255,.35);margin:0 10px}
.ph-count{font-family:var(--font-display);font-size:120px;color:#fff;-webkit-text-stroke:3px var(--ink);text-shadow:4px 4px 0 var(--bubble)}
.ph-bottom{padding:8px 10px calc(12px + var(--sab));display:flex;flex-direction:column;gap:6px;background:linear-gradient(0deg,rgba(18,12,36,.8),rgba(18,12,36,.35))}
.ph-row{display:flex;align-items:center;gap:8px;min-width:0}
.ph-row .label{color:#e9e3ff;width:46px;flex:none}
.ph-chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;min-width:0}
.ph-chips .chip{flex:none;cursor:pointer;min-height:34px;padding:4px 12px;font-size:13px}
.ph-chips .chip.on{background:var(--lime)}
.ph-ctl{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:4px}
.ph-shutter{width:68px;height:68px;border-radius:50%;border:4px solid var(--ink);background:radial-gradient(circle,#fff 0 45%,var(--bubble) 47% 100%);box-shadow:3px 3px 0 var(--ink)}
.ph-shutter:active{transform:scale(.94)}
@media (max-height:460px){.ph-row .label{display:none}.ph-bottom{gap:3px;padding-top:4px}.ph-shutter{width:54px;height:54px}.ph-chips .chip{min-height:32px}.ph-top{padding-top:calc(4px + var(--sat));padding-bottom:4px}}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:62}
#flash.go{animation:flash .5s ease-out}
@keyframes flash{from{opacity:.95}to{opacity:0}}
.photo-out{width:100%;max-width:360px;align-self:center;border:3px solid var(--ink);border-radius:12px;box-shadow:4px 4px 0 var(--ink)}
.palette{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.palette .sw{width:100%;height:auto;aspect-ratio:1}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

const Store = {
  d: defaultSave(),
  journal: [],
  mode: 'device',      // 'device' | 'cloud'
  db: null, uid: null,
  _t: null, _writing: false, _again: false,
  _listeners: [],

  loadLocal() {
    try {
      const raw = localStorage.getItem(LS_KEY);
      if (raw) this.d = mergeSave(defaultSave(), JSON.parse(raw));
      const j = localStorage.getItem(LS_JOURNAL);
      if (j) { const jj = JSON.parse(j); if (Array.isArray(jj)) this.journal = jj; else if (jj && Array.isArray(jj.e)) { this.journal = jj.e; this.jUpdated = jj.u || 0; } }
      this.prune();
    } catch (e) { /* storage blocked: run fresh */ }
  },
  async connectCloud() {
    try {
      if (!window.claude || !window.claude.use) return;
      const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      if (!db || !user) return;
      const id = await user.id();
      if (!id) return;
      this.db = db; this.uid = id;
      const [snap, jsnap] = await Promise.all([
        db.doc('data/users/' + id + '/save').get(),
        db.doc('data/users/' + id + '/journal').get(),
      ]);
      let adopted = false;
      if (snap.exists) {
        const remote = snap.data();
        if ((remote.updatedAt || 0) > (this.d.updatedAt || 0)) { this.d = mergeSave(defaultSave(), JSON.parse(JSON.stringify(remote))); adopted = true; }
      }
      if (jsnap.exists) {
        const jr = jsnap.data();
        if (Array.isArray(jr.entries) && (jr.updatedAt || 0) > (this.jUpdated || 0)) { this.journal = JSON.parse(JSON.stringify(jr.entries)); this.jUpdated = jr.updatedAt; try { localStorage.setItem(LS_JOURNAL, JSON.stringify({ u: this.jUpdated, e: this.journal })); } catch (e) {} }
        else if ((this.jUpdated || 0) > (jr.updatedAt || 0)) this.saveJournal();
      }
      this.mode = 'cloud';
      if (adopted) this._listeners.forEach(f => f('load'));
      if (!jsnap.exists && this.journal.length) this.saveJournal();
      if (!snap.exists || !adopted) this.save(true);
    } catch (e) { this.mode = 'device'; this.db = null; }
  },
  onChange(f) { this._listeners.push(f); },
  save(immediate) {
    this.d.updatedAt = Date.now();
    try { localStorage.setItem(LS_KEY, JSON.stringify(this.d)); } catch (e) {}
    clearTimeout(this._t);
    this._t = setTimeout(() => this.flush(), immediate ? 50 : 1500);
  },
  saveJournal() {
    this.jUpdated = Date.now();
    try { localStorage.setItem(LS_JOURNAL, JSON.stringify({ u: this.jUpdated, e: this.journal })); } catch (e) {}
    if (this.db) this.db.doc('data/users/' + this.uid + '/journal').set({ updatedAt: this.jUpdated, entries: this.journal }).catch(() => {});
  },
  async flush() {
    if (!this.db) return;
    if (this._writing) { this._again = true; return; }
    this._writing = true;
    try { await this.db.doc('data/users/' + this.uid + '/save').set(JSON.parse(JSON.stringify(this.d))); }
    catch (e) { if (e && (e.code === 'invalid_argument' || e.code === 'revoked' || e.code === 'not_granted')) { this.db = null; this.mode = 'device'; } }
    this._writing = false;
    if (this._again) { this._again = false; this.flush(); }
  },
  prune() {
    const keep = (obj, days) => { const cut = dayKey(addDays(new Date(), -days)); for (const k in obj) if (k < cut) delete obj[k]; };
    keep(this.d.water, 120); keep(this.d.vlog, 30); keep(this.d.focus.log, 120); keep(this.d.reading, 120); keep(this.d.habits.checks, 120); keep(this.d.plantDays, 365);
    if (this.d.moods.length > 400) this.d.moods = this.d.moods.slice(-400);
    if (this.journal.length > 100) this.journal = this.journal.slice(-100);
  },
};
function mergeSave(base, src) {
  for (const k in src) {
    if (src[k] && typeof src[k] === 'object' && !Array.isArray(src[k]) && base[k] && typeof base[k] === 'object' && !Array.isArray(base[k])) base[k] = mergeSave(base[k], src[k]);
    else base[k] = src[k];
  }
  return base;
}

const LEVEL_STEP = 60;
function level() { return 1 + Math.floor(Store.d.vibes / LEVEL_STEP); }
function award(kind, silent) {
  const r = VIBE_RULES[kind]; if (!r) return 0;
  const day = dayKey(); const log = Store.d.vlog[day] || (Store.d.vlog[day] = {});
  const n = log[kind] || 0;
  if (n >= r.cap) { if (!silent) toast(`<b>VIBES</b> Daily cap reached for ${r.label.toLowerCase()}. Still counts IRL.`); return 0; }
  log[kind] = n + 1;
  if (!['game', 'beat', 'mission', 'typing', 'math'].includes(kind)) Tokens.earn();
  const before = level();
  Store.d.vibes += r.pts;
  const after = level();
  Missions.tick(kind);
  Store.save();
  HUD.refreshVibes();
  if (!silent) toast(`<b>+${r.pts} VIBES</b> ${r.label}`, 'vibe');
  if (after > before) { setTimeout(() => toast(`<b>LEVEL ${after}</b> New fits might be unlocked in the closet`, 'vibe'), 600); SFX.levelUp(); }
  else SFX.coin();
  return r.pts;
}
// arcade tokens: 3 free a day, +1 for each real-life thing you do (up to 6 more)
const Tokens = {
  roll() { const t = Store.d.tokens, d = dayKey(); if (t.day !== d) { t.day = d; t.used = 0; t.earned = 0; } return t; },
  left() { const t = this.roll(); return Math.max(0, 3 + t.earned - t.used); },
  earn() { const t = this.roll(); if (t.earned < 6) t.earned++; },
  spend() { if (this.left() <= 0) return false; this.roll().used++; Store.save(); return true; },
};
function countToday(kind) { const l = Store.d.vlog[dayKey()]; return (l && l[kind]) || 0; }

const Missions = {
  ensure() {
    const m = Store.d.missions, day = dayKey();
    if (m.day === day && m.ids.length) return;
    const r = rng(hashStr(day + Store.d.screenName));
    const pool = MISSION_POOL.slice();
    const ids = [];
    while (ids.length < 3) { const i = Math.floor(r() * pool.length); ids.push(pool.splice(i, 1)[0].id); }
    Store.d.missions = { day, ids, bonus: false };
    Store.save();
  },
  list() { this.ensure(); return Store.d.missions.ids.map(id => MISSION_POOL.find(x => x.id === id)).filter(Boolean); },
  progress(ms) { return Math.min(ms.need, countToday(ms.kind)); },
  tick(kind) {
    this.ensure();
    const all = this.list();
    if (!all.some(x => x.kind === kind)) return;
    const done = all.every(x => this.progress(x) >= x.need);
    if (done && !Store.d.missions.bonus) { Store.d.missions.bonus = true; setTimeout(() => { award('mission'); SFX.pager(); }, 900); }
  },
};

function plushMesh(p) {

  const ears = p.id === 'bunny' ? [[0.025, 0.25, 0.016, 0.05]] : p.id === 'alien' ? [[0.03, 0.24, 0.01, 0.03]] : p.id === 'cat' ? [[0.035, 0.23, 0.02, 0.025]] : [[0.04, 0.22, 0.022, 0.012]];
  ears.forEach(([x, y, r, hgt]) => [x, -x].forEach(xx => { const e = celMesh(hgt > 0.02 ? new THREE.ConeGeometry(r, hgt * 1.4, 6) : new THREE.SphereGeometry(r, 6, 5), p.col, { t: 0.008 }); e.position.set(xx, y, 0); g.add(e); }));
  [0.022, -0.022].forEach(x => { const e = new THREE.Mesh(new THREE.SphereGeometry(0.009, 6, 4), new THREE.MeshBasicMaterial({ color: 0x1d1433 })); e.position.set(x, 0.19, 0.055); g.add(e); });
  mergeChildren(g, null, 0.01);
  return g;
}
function updatePrizes() {
  if (!W.prizeShelf) return;
  while (W.prizeShelf.children.length) W.prizeShelf.remove(W.prizeShelf.children[0]);
  (Store.d.prizes || []).slice(0, 10).forEach((id, i) => {
    const p = PRIZES.find(x => x.id === id); if (!p) return;
    const m = plushMesh(p); m.position.set(1.32, i < 5 ? 1.12 : 1.57, -8.1 + (i % 5) * 0.25); m.rotation.y = -Math.PI / 2 + (i % 2 ? 0.25 : -0.2); W.prizeShelf.add(m);
  });
}

// ---------- paint: recolor wall vertices by which room each face looks into ----------
function applyPaint() {
  const paint = Object.assign({}, ROOM_PAINT, (Store.d.decor && Store.d.decor.paint) || {});
  const c = new THREE.Color();
  W.wallLines.forEach(L => {
    [L.full, L.low].forEach(grp => grp.children.forEach(m => {
      if (!m.isMesh || !m.userData.wall || !m.geometry.attributes.color) return;
      const k = m.userData.wall === 'x' ? 2 : 0;
      const pos = m.geometry.attributes.position.array, nor = m.geometry.attributes.normal.array, col = m.geometry.attributes.color.array;
      for (let i = 0; i < pos.length; i += 9) { // one triangle at a time, judged by its centre
        const n = nor[i + k]; if (Math.abs(n) < 0.5) continue; // caps keep their color
        const cx = (pos[i] + pos[i + 3] + pos[i + 6]) / 3, cz = (pos[i + 2] + pos[i + 5] + pos[i + 8]) / 3;
        const room = roomAt(cx + (k === 0 ? n * 0.25 : 0), cz + (k === 2 ? n * 0.25 : 0));
        if (!(room in paint)) continue;
        c.set(paint[room]);
        for (let v = 0; v < 9; v += 3) { col[i + v] = c.r; col[i + v + 1] = c.g; col[i + v + 2] = c.b; }
      }
      m.geometry.attributes.color.needsUpdate = true;
    }));
  });
}

const Caps = { sample: null, tools: false };
async function resolveCaps() {
  try {
    if (!window.claude || !window.claude.use) { useClaudeKey(); return; } // a regular website: the player's own API key, if saved
    const s = await window.claude.use('sample');
    if (!s) return;
    Caps.sample = s;
    try { const lim = await s.limits(); Caps.tools = !!(lim && lim.tools); Caps.toolMax = lim && lim.tools && lim.tools.maxCount || 0; } catch (e) { Caps.tools = false; }
  } catch (e) {}
}
function sampleErr(e) {
  const c = e && e.code;
  if (c === 'not_granted' || c === 'sampling_disabled' || c === 'not_declared' || c === 'capability_disabled' || c === 'capability_removed') { Caps.sample = null; return Buddy.name() + ' is offline for this viewer.'; }
  if (c === 'rate_limited') return 'Too many messages too fast. Try again in a bit.';
  if (c === 'session_expired') return 'Sign in to Claude again to keep chatting.';
  if (c === 'refused') return Buddy.name() + ' can\'t help with that one.';
  if (c === 'cancelled') return '';

// ---------- focus timer (runs everywhere) ----------
const Focus = {
  phase: 'focus', total: 25 * 60, left: 25 * 60, running: false, endAt: 0, task: '',
  setLen(min) { if (this.running) return; Store.d.focus.len = min; Store.save(); this.phase = 'focus'; this.total = this.left = min * 60; },
  start() { if (this.running) return; this.running = true; this.endAt = Date.now() + this.left * 1000; SFX.click(); },
  pause() { if (!this.running) return; this.left = Math.max(0, (this.endAt - Date.now()) / 1000); this.running = false; },
  reset() { this.running = false; this.phase = 'focus'; this.total = this.left = (Store.d.focus.len || 25) * 60; },
  tick() {
    if (!this.running) return;
    this.left = Math.max(0, (this.endAt - Date.now()) / 1000);
    if (this.left > 0) return;
    this.running = false;
    if (this.phase === 'focus') {
      const day = dayKey(); Store.d.focus.log[day] = (Store.d.focus.log[day] || 0) + 1; Store.save();
      SFX.chime(); award('focus');
      toast('<b>FOCUS DONE</b> Stand up, stretch, drink water. Break started.');
      this.phase = 'break'; this.total = this.left = (Store.d.focus.brk || 5) * 60; this.start();
    } else {
      SFX.pager(); toast('<b>BREAK OVER</b> Ready for another round?');
      this.phase = 'focus'; this.total = this.left = (Store.d.focus.len || 25) * 60;
    }
    if (PC.wins.some(w => w.id === 'focus')) PC.rerender('focus');
  },
};
setInterval(() => Focus.tick(), 500);

// ----- Neon Pong (you at the bottom vs the CPU at the top) -----
function pongGame(b, w) {

  const info = h('div', { class: 'row', style: { justifyContent: 'center' } }, h('span', { class: 'chip num', text: 'Wins: ' + (Store.d.scores.pongWins || 0) }));

  cv.addEventListener('pointermove', (e) => { if (S.drag || e.pointerType === 'mouse') S.target = toCanvas(e); });
  cv.addEventListener('pointerup', () => { S.drag = false; });

  let raf = 0, last = performance.now();
  const loop = () => {
    if (!document.body.contains(cv)) return; raf = requestAnimationFrame(loop);
    const now = performance.now(), k = Math.min(3, (now - last) / 16.7); last = now;
    S.px += (clamp(S.target, PW / 2, W0 - PW / 2) - S.px) * Math.min(1, 0.35 * k);
    if (S.state === 'play') {
      const lvl = 0.06 + Math.min(0.06, (S.me + S.cpu) * 0.006);
      S.cx += clamp(S.bx - S.cx, -3.4 * k, 3.4 * k) * (S.vy < 0 ? 1 : 0.35) * (lvl / 0.08);
      S.bx += S.vx * k; S.by += S.vy * k;

      if (S.by > H0 + 10) { S.cpu++; SFX.err(); S.state = S.cpu >= 5 ? 'over' : 'ready'; if (S.state === 'over') award('game', true); }
      if (S.by < -10) { S.me++; SFX.coin(); S.state = S.me >= 5 ? 'over' : 'ready'; if (S.state === 'over') { Store.d.scores.pongWins = (Store.d.scores.pongWins || 0) + 1; Store.save(); award('game', true); info.firstChild.textContent = 'Wins: ' + Store.d.scores.pongWins; } }

    g.strokeStyle = 'rgba(34,209,230,.5)'; g.strokeRect(2, 2, W0 - 4, H0 - 4);
    neonText(g, String(S.cpu), W0 - 24, H0 / 2 - 14, 16, '#ff4fae'); neonText(g, String(S.me), W0 - 24, H0 / 2 + 28, 16, '#22d1e6');
    S.trail.forEach((p, i) => { g.fillStyle = `rgba(255,244,122,${i / S.trail.length * 0.35})`; g.fillRect(p[0] - 3, p[1] - 3, 6, 6); });

    g.fillStyle = S.flash > 0 ? '#ffffff' : '#22d1e6'; g.fillRect(S.px - PW / 2, H0 - 30, PW, PH); S.flash = Math.max(0, S.flash - 0.08 * k);
    if (S.state !== 'play') { g.fillStyle = 'rgba(7,4,26,.6)'; g.fillRect(0, H0 / 2 - 50, W0, 100); neonText(g, S.state === 'over' ? (S.me > S.cpu ? 'YOU WIN!' : 'CPU WINS') : 'NEON PONG', W0 / 2, H0 / 2 - 10, 18, S.state === 'over' && S.me > S.cpu ? '#b8f03a' : '#fff47a'); neonText(g, isTouch ? 'TAP TO SERVE' : 'CLICK OR SPACE', W0 / 2, H0 / 2 + 22, 10, '#ffffff'); }
  };
  loop();
  w.cleanup = () => cancelAnimationFrame(raf);
}

function buddyChat(b, where) {
  const nm = Buddy.name();

  const log = h('div', { class: 'im-log', 'aria-live': 'polite' });

  const ta = h('textarea', { class: 'osin', id: where === 'pc' ? 'chatIn' : 'buddyIn', rows: 1, placeholder: Caps.sample ? 'Type a message…' : nm + ' is away', disabled: !Caps.sample, onkeydown: (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } } });
  const sendB = h('button', { class: 'osbtn big', onclick: () => Chat.busy ? Chat.ctl && Chat.ctl.abort() : send(), disabled: !Caps.sample }, Chat.busy ? 'Stop' : 'Send');
  wrap.append(head, log, h('div', { class: 'im-in' }, ta, sendB));
  const line = (who, text, cls) => { const m = h('div', { class: 'm ' + cls }); if (who) m.append(h('b', { text: who + ': ' })); const p = h('p', { text }); m.append(p); log.append(m); log.scrollTop = log.scrollHeight; return p; };
  if (!Caps.sample) line('', `Away message: "brb, saving the world from Y2K." ${nm} ${inClaude() ? 'needs a signed-in Claude viewer to chat' : 'needs a Claude API key to chat. Tap ' + nm + ' in the room to add one'}. Tricks and everything else still work.`, 'sys');
  else if (!Chat.turns.length) line(nm, 'heyyy ' + Store.d.screenName + '! i can switch the music, start a timer, add to-dos, change the weather, throw a party, paint your walls, walk you places, or just talk. what\'s up?', 'bot');
  Chat.turns.forEach(t => line(t.role === 'user' ? Store.d.screenName : nm, t.content, t.role === 'user' ? 'me' : 'bot'));
  if (Caps.sample && !Chat.turns.length) {
    const chips = h('div', { class: 'im-chips' }, ['how was my day so far?', 'play something chill', 'throw a party!', 'paint the arcade pink', 'make it snow'].map(s => h('button', { class: 'chip', onclick: () => { ta.value = s; send(); } }, s)));
    log.append(chips);
  }
  async function send() {
    const text = ta.value.trim(); if (!text || Chat.busy || !Caps.sample) return;
    const chips = log.querySelector('.im-chips'); if (chips) chips.remove();
    ta.value = ''; Chat.turns.push({ role: 'user', content: text }); line(Store.d.screenName, text, 'me');
    blip([880, 1320], 0.06, 'square', 0.05, 0.06);
    const out = line(nm, 'is typing…', 'bot');
    Chat.busy = true; sendB.textContent = 'Stop'; Chat.ctl = new AbortController();
    Buddy.setExpr('talk', 30);
    const B = Store.d.buddy, vibe = BUDDY_VIBES[B.vibe] || BUDDY_VIBES.chill;
    const rules = `You are ${nm}, a small floating robot buddy from the year 2000 who lives in a cozy Y2K apartment game called Dial-Up Den and follows the user around. The user's screen name is ${Store.d.screenName}. ${vibe.rule} Write like an instant-messenger buddy: 1-4 sentences, lowercase is fine, light Y2K flavor (at most one slang word per reply), no markdown, no lists. Help with real life when asked: study, budgeting, cooking, sleep, habits, motivation, feelings. You can't open websites or play YouTube. The apartment has: living room (couch + TV with the user's own videos, computer, fridge to-dos, dance pad), bedroom (bed, journal, habit calendar, yoga mat, closet), studio (groovebox beat maker, DJ booth, synth that teaches songs, guitar practice timer), arcade (Neon Pong, Star Blaster, Snake, claw machine, photo booth, hydration station), bathroom (brush timer, skincare, shower timer) and patio (plants, hammock, breathing cushion, grill recipes, water cooler). Radio stations: ${STATIONS.map(s => s.id + ' = ' + s.name).join('; ')}.${Caps.tools ? ' When the user asks you to do something in the apartment, use a tool, then confirm in one short line. Use get_my_day before commenting on their progress. Never invent progress numbers.' : ''} Current in-game time: ${fmtClock(gameHour())}. Room: ${roomAt(Player.x, Player.z)}.`;
    const hist = Chat.turns.slice(-12); while (hist.length && hist[0].role !== 'user') hist.shift();
    const turns = [{ role: 'user', content: rules }, { role: 'assistant', content: 'got it! ready.' }, ...hist];
    const opts = { modelTier: B.tier || 'quick', signal: Chat.ctl.signal, onText: ({ text: tx }) => { out.textContent = tx; log.scrollTop = log.scrollHeight; Buddy.sayUntil = performance.now() + 800; } };
    if (Caps.tools) opts.tools = buddyTools(); else opts.cache = false;
    try {
      const res = await Caps.sample(turns, opts);
      const reply = res.text;
      out.textContent = reply; Chat.turns.push({ role: 'assistant', content: reply });
      Buddy.lastTier = res.modelTierApplied || null;
      const hd = head.lastChild; if (hd && res.modelTierApplied) hd.textContent = (BRAINS[res.modelTierApplied] || { name: res.modelTierApplied }).name + ' brain · online' + (res.modelTierApplied !== (B.tier || 'quick') ? ' (plan limit)' : '');
      if (res.truncated) line('', 'That reply got cut off. Ask for a shorter version?', 'sys');
      blip([660, 990], 0.08, 'square', 0.05, 0.07);
      if (where !== 'pc' || !PC.open) Buddy.shout(reply.length > 90 ? reply.slice(0, 88) + '…' : reply, Math.min(8, 2 + reply.length / 25));
    } catch (e) {
      const msg = sampleErr(e);
      if (e && e.text && e.code !== 'refused') { out.textContent = e.text; Chat.turns.push({ role: 'assistant', content: e.text }); }
      else { out.parentElement.remove(); Chat.turns.pop(); }
      if (msg) line('', msg, 'sys');
    }
    Buddy.setExpr('happy', 1.5);
    Chat.busy = false; sendB.textContent = 'Send'; if (Chat.turns.length > 30) Chat.turns = Chat.turns.slice(-30);
  }
  if (!isTouch) setTimeout(() => ta.focus(), 50);
}

// ---------- couch view: sit back and watch the TV from the couch ----------
// While you sit, the camera is your eyes: it looks straight at the TV and zooms so it fills the free part of

// remote bar takes its place; the full remote (and mood check-in) opens from the bar.
const ICO_PLAY = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4v16l13-8z"/></svg>';
const ICO_PAUSE = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>';

  seated() { return !!(Activity.cur && Activity.cur.id === 'couch'); },
  // the bar shows while you sit there and nothing else covers the room
  want() { return !!(started && this.seated() && !Panel.cur && !Theater.on && !PC.open && !Photo.on && !Beat.on); },
  update() {

    tvHiRes(seated);

  media() { return TV.channel === 1 && Vid.current() ? 'vid' : TV.channel === 2 && YT.el && YT.ok() ? 'yt' : ''; },
  playPause() { const m = this.media(); if (m === 'vid') Vid.toggle(); else if (m === 'yt') YT.toggle(); },
  refresh() {

    const m = this.media(), pp = !m ? '' : (m === 'vid' ? Vid.playing : YT.playing) ? 'pause' : 'play';

  },
  remote(tab) { if (tab) Acts._couchTab = tab; couchPanel(); },
  getUp() { if (Panel.cur) Panel.close(true); Theater.close(); Activity.end(); },
  // lens + offset so the TV sits centered in whatever part of the screen is free, as big as fits comfortably
  view() {
    const now = performance.now(), pan = Panel.cur && !Panel.cur.el.classList.contains('collapsed') ? Panel.cur.el : null;

    if (this._el !== el || now - this._t > 300) { this._el = el; this._r = el ? el.getBoundingClientRect() : null; this._t = now; }
    const r = this._r;

// ---------- watch party: friends watch the same YouTube video together, in sync (website only) ----------
// A party is a room with a 6-digit number in the game's Firebase Realtime Database, reached with plain web
// requests (no Firebase code needed): rooms/<number> = { created, tv, peers, chat }
//   tv     what's on: video, playing or paused, and its position at a Firebase timestamp
//   peers  who's here (everyone checks in every 15 seconds)
//   chat   messages and emoji reactions (trimmed to the latest few dozen)
// Changes arrive live over one streaming connection (or by checking every few seconds if that's blocked).
// Each player works out where the video should be "now" and nudges itself back if it drifts. Anyone can
// drive: play, pause, skip or pick a video and it happens for everyone. Everything that comes from a room
// is treated as untrusted: checked, trimmed, and only ever shown as text.
const PARTY_DB = 'https://dialup-den-default-rtdb.firebaseio.com';
const SITE_URL = 'https://toltecs101.github.io/dialup-den/';
const PARTY_EMOJI = ['😂', '😮', '🔥', '❤️', '👏', '💀'];
const FB_NOW = { '.sv': 'timestamp' }; // Firebase fills in its own clock

const PartyNet = {
  url(path) { return PARTY_DB.replace(/\/+$/, '') + '/' + path + '.json'; },
  async req(method, path, body) {
    let r;
    try { r = await fetch(this.url(path), { method, cache: 'no-store', body: body === undefined ? undefined : JSON.stringify(body) }); }
    catch (e) { throw { code: 'network' }; }
    const j = await r.json().catch(() => null);
    if (!r.ok) throw { code: r.status === 401 || r.status === 403 ? 'denied' : 'http', status: r.status };
    return j;
  },
};

const WatchParty = {
  room: '', pid: '', R: null, S: null, seq: 0, tvKey: '', echoWait: 0, seen: new Set(), peersSeen: new Map(),

  off: 0, offErr: Infinity, offAt: 0, beatT0: 0, beatDone: 0,
  away: false, cmdAt: 0, playAt: 0, seekAt: 0, loadedAt: 0, stuckAt: 0, nudged: '',

  ready() { return !!PARTY_DB && !inClaude(); },

  now() { return Date.now() + this.off; }, // Firebase's clock, as best we can tell
  link() { return location.origin + location.pathname + '?party=' + this.room; },

  init() {
    $('#partyPill').onclick = () => this.open();
    $('#cbParty').onclick = () => { this.tray = !this.tray; this.render(); };
    const tray = $('#reactTray');
    PARTY_EMOJI.forEach(e => tray.append(h('button', { class: 'btn ic', 'aria-label': 'React ' + e, onclick: () => this.react(e) }, e)));
    tray.append(h('button', { class: 'btn lilac', id: 'trayChat', onclick: () => { this.tray = false; this.open(); } }, 'Chat'));
    W.updaters.push(() => { if (this.tray && !Couch.on) { this.tray = false; this.render(); } });
    addEventListener('pagehide', () => this.bye());
    addEventListener('pageshow', (e) => { if (e.persisted && this.room) { this.beat(); this.listen(); } });
    document.addEventListener('visibilitychange', () => {
      if (document.hidden || !this.room) return;
      this.beat(); if (!this.polling && Date.now() - this.lastEv > 20000) this.listen(); this.apply();
    });
    if (this.ready()) { try { const c = new URL(location.href).searchParams.get('party'); if (/^\d{6}$/.test(c || '')) this.inviteCode = c; } catch (e) {} }
  },

  // ---- rooms ----
  async start() {
    if (!this.ready() || this.busy || this.room) return;
    this.busy = true; this.err = ''; this.refreshPanel();
    try {
      let code = '';
      for (let i = 0; i < 6 && !code; i++) {
        const c = String(100000 + crypto.getRandomValues(new Uint32Array(1))[0] % 900000);
        if (!this.alive(await PartyNet.req('GET', 'rooms/' + c))) code = c;
      }
      if (!code) throw { code: 'busy' };
      this.pid = uid(); this.seq = 0;
      const tv = this.tvNow(), t0 = Date.now();
      const r = await PartyNet.req('PUT', 'rooms/' + code, { created: FB_NOW, tv: Object.assign({}, tv, { at: FB_NOW }), peers: { [this.pid]: this.me() } });
      const me = r && r.peers && r.peers[this.pid];
      if (!this.clock(me && me.t, t0, Date.now())) { this.beatT0 = t0; this.beatDone = Date.now(); }

      this.enter(code, R);

  },
  async join(code) {

    if (code.length !== 6) { this.err = 'Room numbers have 6 digits.'; this.refreshPanel(); return; }
    if (code === this.room) { this.refreshPanel(); return; }
    if (this.room) await this.leave(true);
    this.busy = true; this.err = ''; this.refreshPanel();
    try {
      const room = await PartyNet.req('GET', 'rooms/' + code);
      if (!room || typeof room !== 'object') throw { code: 'none' };
      if (!this.alive(room)) throw { code: 'ended' };
      this.pid = uid(); this.seq = 0;
      const t0 = Date.now(); this.beatT0 = t0;
      const r = await PartyNet.req('PUT', `rooms/${code}/peers/${this.pid}`, this.me());
      if (this.clock(r && r.t, t0, Date.now())) this.beatT0 = 0; else this.beatDone = Date.now();
      this.inviteCode = '';
      this.R = room; this.setAt(['peers', this.pid], { n: this.name(), t: this.now() });
      this.enter(code, this.R);
      const others = this.here().slice(1).map(p => p.n);
      toast('<b>JOINED PARTY ' + code + '</b> ' + (others.length ? 'with ' + esc(others.slice(0, 3).join(', ')) + (others.length > 3 ? ' +' + (others.length - 3) : '') : 'Nobody else is here right now'), '', 4000);
      if (isSmall() && Panel.cur && Panel.cur.o.party) Panel.close(true); // phones: get out of the way of the video (the pill brings it back)
    } catch (e) { this.err = this.errText(e); }
    this.busy = false; this.refreshPanel();
  },
  // a room is worth joining if someone checked in during the last 15 minutes (phones that slept still count)
  alive(room) {
    const P = room && typeof room === 'object' && room.peers && typeof room.peers === 'object' ? room.peers : null;
    if (!P) return false;
    const now = this.now();

  },
  errText(e) {

      : c === 'denied' ? 'The party server said no. It may not be set up yet.'
      : c === 'busy' ? 'Couldn\'t find a free room number. Try again.'
      : 'Couldn\'t reach the party server. Check your connection and try again.';
  },
  me() { return { n: this.name(), t: FB_NOW }; },
  // what your TV is showing right now (a party you start begins with it)
  tvNow() {

    return { v, pos: v ? Math.round(YT.pos() * 100) / 100 : 0, p: !!(v && YT.playing), ti: v ? String(YT.title || '').slice(0, 100) : '', e: 0, by: this.pid, n: this.name(), q: ++this.seq };

  teardown() {

  async leave(quiet) {
